name: Release
on: workflow_dispatch

permissions:
  contents: write
  discussions: write

jobs:
  build:
    name: Kernel
    uses: ./.github/workflows/main.yml

  releaser:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@main
        with:
           merge-multiple: true
           path: /home/runner

      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "1.7.0-1"
          tag_name: "1.7.0-1"
          prerelease: false
          files: /home/runner/SN_*.zip
