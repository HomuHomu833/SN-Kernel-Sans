name: Build Kernel

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: ['AOSP', 'OneUI']
        device: ['a51', 'm21', 'm31', 'm31s', 'f41', 'gta4xl', 'gta4xlwifi']
    name: "Build for ${{matrix.device}} (${{matrix.build_type}})"
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 1
          submodules: recursive
          
      - name: Install Neutron Clang
        run: |
          sudo apt install libarchive-tools -y
          mkdir toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          echo Done.
          
      - name: Build
        run: |
          mkdir -p KernelSU/kernel/include
          mv include/linux/ksu_hook.h KernelSU/kernel/include
          BUILD_TYPE_LOWER=$(echo "${{matrix.build_type}}" | tr '[:upper:]' '[:lower:]')
          python build_kernel.py --$BUILD_TYPE_LOWER --target=${{matrix.device}} --ksu
          mv SN_*.zip "SN_${{matrix.device}}_${{matrix.build_type}}-KSU.zip"

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: SN_${{matrix.device}}_${{matrix.build_type}}-KSU
          path: "SN_${{matrix.device}}_${{matrix.build_type}}-KSU.zip"
          if-no-files-found: error

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: SN_${{matrix.device}}_${{matrix.build_type}}-LOG
          path: "*.log"
          if-no-files-found: warn
